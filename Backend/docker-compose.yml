services:
  db:
    build: ./database
    container_name: lagerklar-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: lagerklar-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside Docker the database is reached via the service name "db", not localhost
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      PORT: "8080"
    # Not published on the host: Caddy reaches it as backend:8080 on the
    # internal Docker network, and Caddy itself is published on host port 8080.
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.8-alpine
    container_name: lagerklar-caddy
    restart: unless-stopped
    env_file: .env
    environment:
      BACKEND_UPSTREAM: backend:8080
    depends_on:
      - backend
    ports:
      # Host port 80 is taken by nginx on the server, so Caddy is published
      # on 8080 instead. Override with CADDY_PORT in .env if needed.
      - "${CADDY_PORT:-8080}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
